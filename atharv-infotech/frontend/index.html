      const formatPrice = (amount) => {
        const curr = CURRENCIES[currency];
        const converted = amount * curr.rate;
        if (currency === 'INR') {
          return `${curr.symbol}${converted.toLocaleString('en-IN', { maximumFractionDigits: 0 })}`;
        }
        return `${curr.symbol}${converted.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      };

      const addToCart = (product, quantity = 1) => {
        setCart((prev) => {
          const existing = prev.find((item) => item.id === product.id);
          if (existing) {
            return prev.map((item) =>
              item.id === product.id ? { ...item, quantity: item.quantity + quantity } : item
            );
          }
          return [...prev, { ...product, quantity }];
        });
        setIsCartOpen(true);
      };

        setCart((prev) =>

        setCart((prev) => prev.filter((item) => item.id !== id));
      };

        setWishlist((prev) => {
          const exists = prev.some((p) => p.id === product.id);

    // --- EMI CALCULATOR MODAL ---
    function EmiCalculatorModal({ product, onClose, formatPrice }) {
      const [tenure, setTenure] = useState(6);
      const interestRate = 0.14; // 14% p.a.

      const monthlyEmi = useMemo(() => {
        const r = interestRate / 12;
        const n = tenure;
        const emi = (product.price * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
        return Math.round(emi);
      }, [product.price, tenure]);

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white border border-slate-200 rounded-2xl max-w-md w-full p-6 space-y-4 relative shadow-2xl">

            <div className="flex items-center gap-2 text-brand-600">
              <i className="fa-solid fa-calculator text-lg"></i>
              <h3 className="text-lg font-bold text-slate-900">Easy EMI Estimator</h3>
            </div>

            <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-1">
              <h4 className="text-xs font-bold text-slate-900 line-clamp-1">{product.name}</h4>
              <div className="text-xs text-emerald-600 font-extrabold">Price: {formatPrice(product.price)}</div>
            </div>

            <div className="space-y-2">
              <label className="text-xs font-bold text-slate-600 block">Select Tenure (Months)</label>
              <div className="grid grid-cols-4 gap-2">
                {[3, 6, 9, 12].map((m) => (
                  <button
                    key={m}
                    onClick={() => setTenure(m)}
                    className={`py-2 rounded-lg text-xs font-bold transition ${tenure === m ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-700'}`}
                  >
                    {m} Mo
                  </button>
                ))}
              </div>
            </div>

            <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-center space-y-1">
              <span className="text-xs text-slate-500 font-medium">Estimated Monthly Installment</span>
              <div className="text-2xl font-black text-emerald-600">{formatPrice(monthlyEmi)} / month</div>
              <span className="text-[10px] text-slate-400">Calculated at standard bank interest rate</span>
            </div>

            <button onClick={onClose} className="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl text-xs">
              Close Estimator
            </button>
          </div>
        </div>
      );

      const applyPromo = () => {
        if (promoCode.trim().toUpperCase() === 'ATHARVA10' || promoCode.trim().toUpperCase() === 'LOWESTPRICE') {

              <h3 className="text-lg font-bold text-slate-900">Distributor Supplier Integration</h3>
            </div>

            <p className="leading-relaxed">
              Connect Atharva Infotech directly to distributor inventory feeds using environment variables.
            </p>

            <div className="bg-slate-900 p-4 rounded-xl text-emerald-400 font-mono text-[11px] space-y-1">
              <div># Distributor API Credentials (.env.local)</div>
              <div>ATHARVA_DISTRIBUTOR_FEED_URL="https://api.distributor.com/v1/stock"</div>
              <div>ATHARVA_API_SECRET_KEY="ath_secret_key_prod"</div>
              <div>SUPABASE_URL="https://your-project.supabase.co"</div>
            </div>

            <button onClick={onClose} className="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-2.5 rounded-xl transition shadow-sm">
              Close Guide
            </button>
          </div>
        </div>
      );
    }

    // MOUNT APP
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
